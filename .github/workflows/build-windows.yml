name: Build Forge for Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'forge-windows/**'
      - '.github/workflows/build-windows.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: forge-windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: forge-windows/package.json
      - name: Generate Windows icon
        shell: pwsh
        run: magick forge-logo.svg -define icon:auto-resize=256,128,64,48,32,16 forge-icon.ico
      - name: Install dependencies
        run: npm install
      - name: Build Windows packages
        run: npm run dist
      - name: Upload Forge installer
        uses: actions/upload-artifact@v4
        with:
          name: forge-windows
          path: forge-windows/dist/*.exe
