name: Compilar APK Forge
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
        working-directory: forge-app
      - run: npx cap add android
        working-directory: forge-app
      - run: npx cap sync android
        working-directory: forge-app
      - run: chmod +x gradlew
        working-directory: forge-app/android
      - run: ./gradlew assembleDebug
        working-directory: forge-app/android
      - uses: actions/upload-artifact@v4
        with:
          name: forge-apk
          path: forge-app/android/app/build/outputs/apk/debug/app-debug.apk
