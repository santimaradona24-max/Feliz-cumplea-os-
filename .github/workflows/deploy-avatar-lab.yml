name: Build Avatar Lab
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-avatar-lab.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: avatar-lab-bundled-assets-v3
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Get the original character engine
        run: git clone --depth 1 https://github.com/olatunde85/3d-gen.git "$RUNNER_TEMP/ara"

      - name: Patch the original design with procedural anatomy
        run: |
          export ARA_DIR="$RUNNER_TEMP/ara"
          python3 - <<'PY'
          import os, textwrap
          from pathlib import Path

          root = Path(os.environ["ARA_DIR"])
          def read(p): return (root / p).read_text(encoding="utf-8")
          def write(p, s): (root / p).write_text(s, encoding="utf-8")
          def once(s, old, new, label):
              n = s.count(old)
              if n != 1:
                  raise SystemExit("Patch stopped: " + label + " (anchors=" + str(n) + ")")
              return s.replace(old, new, 1)

          # 1) Only add parameters for the integrated procedural mesh; no new packages or downloaded assets.
          p = read("src/core/params.ts")
          p = once(p, "  breastFirmness: number;", """  breastFirmness: number;
            intimateType: 'auto' | 'male' | 'female';
            intimateSize: number;
            intimateForm: number;
            intimateTint: string;
            pubicHair: boolean;
            pubicHairAmount: number;
            pubicHairLength: number;
            pubicHairColor: string;""", "anatomy parameter types")
          p = once(p, "  breastFirmness: 0.5,", """  breastFirmness: 0.5,
            intimateType: 'auto',
            intimateSize: 1,
            intimateForm: 0.5,
            intimateTint: '#ffffff',
            pubicHair: true,
            pubicHairAmount: 0.55,
            pubicHairLength: 1,
            pubicHairColor: '#34251f',""", "anatomy parameter defaults")
          write("src/core/params.ts", p)

          # 2) Procedural polygon mesh helpers. Coordinates are built in the engine's native units
          # and pass through its existing scale, skin-weight transfer, rig, renderer and exporters.
          human = read("src/core/human.ts")
          helper = r'''type IntimateMeshBuilder = { positions: number[]; faces: number[][] };
          type IntimatePiece = { mesh: PolyMesh; kind: 'skin' | 'detail' | 'hair' };

          function newIntimateBuilder(): IntimateMeshBuilder {
            return { positions: [], faces: [] };
          }
          function intimateVertex(b: IntimateMeshBuilder, p: Vec3): number {
            const i = b.positions.length / 3;
            b.positions.push(p[0], p[1], p[2]);
            return i;
          }
          function intimateEllipsoid(
            b: IntimateMeshBuilder, c: Vec3, r: Vec3, segments = 20, rings = 12,
          ): void {
            const top = intimateVertex(b, [c[0], c[1] + r[1], c[2]]);
            const rows: number[][] = [];
            for (let j = 1; j < rings; j++) {
              const theta = Math.PI * j / rings, row: number[] = [];
              for (let k = 0; k < segments; k++) {
                const phi = Math.PI * 2 * k / segments;
                row.push(intimateVertex(b, [
                  c[0] + r[0] * Math.sin(theta) * Math.cos(phi),
                  c[1] + r[1] * Math.cos(theta),
                  c[2] + r[2] * Math.sin(theta) * Math.sin(phi),
                ]));
              }
              rows.push(row);
            }
            for (let k = 0; k < segments; k++) b.faces.push([top, rows[0][(k + 1) % segments], rows[0][k]]);
            for (let j = 0; j < rows.length - 1; j++) {
              const a = rows[j], d = rows[j + 1];
              for (let k = 0; k < segments; k++) {
                const n = (k + 1) % segments;
                b.faces.push([a[k], a[n], d[n], d[k]]);
              }
            }
            const bottom = intimateVertex(b, [c[0], c[1] - r[1], c[2]]);
            const last = rows[rows.length - 1];
            for (let k = 0; k < segments; k++) b.faces.push([bottom, last[k], last[(k + 1) % segments]]);
          }
          function intimateTube(
            b: IntimateMeshBuilder, start: Vec3, length: number, radius: number, form: number,
          ): void {
            const segments = 18, steps = 12, rows: number[][] = [];
            for (let j = 0; j <= steps; j++) {
              const t = j / steps;
              const center: Vec3 = [
                start[0] + (form - 0.5) * 0.18 * t * t,
                start[1] - length * 0.68 * t,
                start[2] + length * 0.73 * t,
              ];
              const profile = (0.78 + 0.27 * Math.sin(Math.PI * t)) * (1 - 0.13 * t);
              const row: number[] = [];
              for (let k = 0; k < segments; k++) {
                const a = 2 * Math.PI * k / segments;
                row.push(intimateVertex(b, [
                  center[0] + Math.cos(a) * radius * profile,
                  center[1] + Math.sin(a) * radius * profile * 0.8,
                  center[2] + Math.sin(a) * radius * profile * 0.65,
                ]));
              }
              rows.push(row);
            }
            for (let j = 0; j < rows.length - 1; j++) {
              for (let k = 0; k < segments; k++) {
                const n = (k + 1) % segments;
                b.faces.push([rows[j][k], rows[j][n], rows[j + 1][n], rows[j + 1][k]]);
              }
            }
          }
          function finishIntimateMesh(b: IntimateMeshBuilder): PolyMesh {
            const positions = Float32Array.from(b.positions);
            const faceVerts = Uint32Array.from(b.faces.flat());
            const uvs = new Float32Array((positions.length / 3) * 2);
            for (let i = 0; i < positions.length; i += 3) {
              uvs[(i / 3) * 2] = Math.atan2(positions[i + 2], positions[i]) / (2 * Math.PI) + 0.5;
              uvs[(i / 3) * 2 + 1] = (positions[i + 1] * 0.1 % 1 + 1) % 1;
            }
            return {
              positions,
              faceSizes: Uint8Array.from(b.faces.map((f) => f.length)),
              faceVerts,
              faceUVs: Uint32Array.from(faceVerts),
              uvs,
            };
          }
          function intimateBaseTone(p: HumanParams): string {
            const palette = [[108, 70, 48], [181, 126, 88], [222, 182, 151]];
            const weights = [p.african, p.asian, p.caucasian].map((x) => Math.max(0, Number(x) || 0));
            const total = weights.reduce((a, b) => a + b, 0) || 1;
            const rgb = [0, 1, 2].map((c) => Math.round(
              palette.reduce((sum, tone, i) => sum + tone[c] * weights[i], 0) / total,
            ));
            return '#' + rgb.map((x) => x.toString(16).padStart(2, '0')).join('');
          }
          function buildIntimateMeshes(
            lib: AssetLibrary, coords: Float32Array, p: HumanParams, type: 'male' | 'female',
          ): IntimatePiece[] {
            const joints = lib.base.meta.joints as Record<string, number[]>;
            const jointPoint = (name: string): Vec3 | undefined => {
              const ids = joints[name];
              if (!ids || !ids.length) return undefined;
              const sum: Vec3 = [0, 0, 0];
              for (const v of ids) {
                sum[0] += coords[v * 3];
                sum[1] += coords[v * 3 + 1];
                sum[2] += coords[v * 3 + 2];
              }
              return [sum[0] / ids.length, sum[1] / ids.length, sum[2] / ids.length];
            };
            const left = jointPoint('upperleg01.L____head');
            const right = jointPoint('upperleg01.R____head');
            const centerX = left && right ? (left[0] + right[0]) * 0.5 : 0;
            const hipY = left && right ? (left[1] + right[1]) * 0.5 : 8.2;
            const centerY = hipY - 0.42;
            let frontZ = -Infinity;
            for (let i = 0; i < coords.length; i += 3) {
              const x = coords[i], y = coords[i + 1], z = coords[i + 2];
              if (Math.abs(x - centerX) < 0.85 && Math.abs(y - centerY) < 0.62) frontZ = Math.max(frontZ, z);
            }
            if (!Number.isFinite(frontZ)) {
              for (let i = 0; i < coords.length; i += 3) {
                if (Math.abs(coords[i + 1] - centerY) < 1.0) frontZ = Math.max(frontZ, coords[i + 2]);
              }
            }
            if (!Number.isFinite(frontZ)) frontZ = 0;
            const z = frontZ + 0.025;
            const size = Math.min(1.5, Math.max(0.65, Number(p.intimateSize) || 1));
            const form = Math.min(1, Math.max(0, Number(p.intimateForm) || 0.5));
            const main = newIntimateBuilder(), detail = newIntimateBuilder(), hair = newIntimateBuilder();

            if (type === 'male') {
              intimateEllipsoid(main, [centerX, centerY + 0.02, z + 0.10], [0.28 * size, 0.19 * size, 0.16 * size]);
              intimateEllipsoid(main, [centerX, centerY - 0.23, z + 0.13], [0.205 * size, 0.16 * size, 0.17 * size]);
              intimateEllipsoid(main, [centerX - 0.105 * size, centerY - 0.25, z + 0.19], [0.112 * size, 0.132 * size, 0.13 * size], 16, 10);
              intimateEllipsoid(main, [centerX + 0.105 * size, centerY - 0.25, z + 0.19], [0.112 * size, 0.132 * size, 0.13 * size], 16, 10);
              const length = 0.69 * size;
              const tip: Vec3 = [centerX + (form - 0.5) * 0.18, centerY + 0.025 - length * 0.68, z + 0.20 + length * 0.73];
              intimateTube(main, [centerX, centerY + 0.07, z + 0.15], length, 0.083 * size * (0.85 + form * 0.28), form);
              intimateEllipsoid(detail, tip, [0.098 * size, 0.10 * size, 0.092 * size], 18, 12);
            } else {
              const width = size * (0.82 + form * 0.34);
              intimateEllipsoid(main, [centerX, centerY + 0.025, z + 0.115], [0.34 * width, 0.27 * size, 0.18 * size]);
              intimateEllipsoid(main, [centerX - 0.105 * width, centerY - 0.12, z + 0.19], [0.115 * width, 0.235 * size, 0.125 * size]);
              intimateEllipsoid(main, [centerX + 0.105 * width, centerY - 0.12, z + 0.19], [0.115 * width, 0.235 * size, 0.125 * size]);
              intimateEllipsoid(detail, [centerX - 0.041 * width, centerY - 0.125, z + 0.285], [0.041 * width, 0.175 * size, 0.045 * size], 16, 10);
              intimateEllipsoid(detail, [centerX + 0.041 * width, centerY - 0.125, z + 0.285], [0.041 * width, 0.175 * size, 0.045 * size], 16, 10);
              intimateEllipsoid(detail, [centerX, centerY + 0.065, z + 0.285], [0.043 * size, 0.052 * size, 0.043 * size], 16, 10);
            }

            const pieces: IntimatePiece[] = [
              { mesh: finishIntimateMesh(main), kind: 'skin' },
              { mesh: finishIntimateMesh(detail), kind: 'detail' },
            ];
            if (p.pubicHair && p.pubicHairAmount > 0.01) {
              let state = (Math.abs(Math.floor(p.seed)) % 2147483646) + 1;
              const random = () => ((state = state * 16807 % 2147483647) - 1) / 2147483646;
              const count = Math.round(Math.min(1, Math.max(0, p.pubicHairAmount)) * 190);
              const rx = type === 'male' ? 0.31 * size : 0.34 * size;
              for (let i = 0; i < count; i++) {
                const x = (random() * 2 - 1) * rx;
                const y = centerY + 0.09 - random() * 0.33 * size;
                const nx = x / Math.max(0.01, rx);
                const ny = (y - (centerY - 0.04)) / (0.31 * size);
                if (nx * nx + ny * ny > 1) continue;
                const rootZ = z + 0.105 + 0.145 * Math.sqrt(Math.max(0, 1 - nx * nx - ny * ny));
                const length = (0.055 + random() * 0.065) * Math.min(1.5, Math.max(0.35, p.pubicHairLength));
                const dx = (random() - 0.5) * 0.055;
                const width = 0.0045 + random() * 0.003;
                const a = intimateVertex(hair, [centerX + x - width, y, rootZ]);
                const b = intimateVertex(hair, [centerX + x + width, y, rootZ + 0.002]);
                const c = intimateVertex(hair, [centerX + x + dx + width * 0.16, y - length, rootZ + 0.012]);
                const d = intimateVertex(hair, [centerX + x + dx - width * 0.16, y - length, rootZ + 0.010]);
                hair.faces.push([a, d, c, b]);
              }
              if (hair.faces.length) pieces.push({ mesh: finishIntimateMesh(hair), kind: 'hair' });
            }
            return pieces;
          }
          '''
          human = once(human, "const DM = 0.1;", "const DM = 0.1;\n\n" + helper, "procedural anatomy mesh helpers")
          anchor = "  parts.push([body, { ...toMaterial(skin.material!), name: 'Skin', color: tint(skin.material!.color, p.skinTint), roughness: 0.55 }]);"
          addition = anchor + """
            // Procedural anatomy is part of the character mesh and shares the existing rig/export path.
            if (ageToYears(p.age) >= 18 && p.outfit === 'none' && p.bottom === 'none' && !p.underwear) {
              const anatomyType = p.intimateType === 'auto' ? (p.gender >= 0.5 ? 'male' : 'female') : p.intimateType;
              const anatomyColor = tint(tint(intimateBaseTone(p), p.skinTint), p.intimateTint);
              for (const piece of buildIntimateMeshes(lib, coords, p, anatomyType)) {
                const isHair = piece.kind === 'hair';
                const color = isHair ? p.pubicHairColor : piece.kind === 'detail' ? tint(anatomyColor, '#edc9b9') : anatomyColor;
                parts.push([skinOf(piece.mesh, 4), {
                  name: isHair ? 'Pubic hair' : piece.kind === 'detail' ? 'Intimate details' : 'Intimate anatomy',
                  color, roughness: isHair ? 0.94 : 0.67, metalness: 0,
                  alpha: 'opaque', doubleSided: true,
                }]);
              }
            }"""
          human = once(human, anchor, addition, "insert integrated intimate mesh")
          write("src/core/human.ts", human)

          # 3) Control panel: the original app layout stays intact; controls update real mesh parameters.
          main = read("src/app/main.ts")
          main = once(main,
              "type ColorKey = 'skinTint' | 'hairTint' | 'outfitTint' | 'hairColor' | 'beardColor' | 'tattooInk';",
              "type ColorKey = 'skinTint' | 'hairTint' | 'outfitTint' | 'hairColor' | 'beardColor' | 'tattooInk' | 'intimateTint' | 'pubicHairColor';",
              "anatomy color controls")
          main = once(main, "const controls = $('#controls');\ncontrols.append(",
              """const controls = $('#controls');
          const pubicHairBox = el('input', { type: 'checkbox' });
          pubicHairBox.addEventListener('change', () => set({ pubicHair: pubicHairBox.checked }));
          sync.push(() => (pubicHairBox.checked = params.pubicHair));
          pubicHairBox.checked = params.pubicHair;
          controls.append(""", "anatomy control initialisation")
          panel = """  section('Anatomía íntima', false,
              selectRow('Anatomía', [['auto', 'Según el cuerpo'], ['male', 'Masculina'], ['female', 'Femenina']], () => params.intimateType, (v) => set({ intimateType: v as HumanParams['intimateType'] })),
              slider('Tamaño', () => params.intimateSize, (v) => set({ intimateSize: v }), 0.65, 1.5, 0.01, (v) => String(v.toFixed(2)) + '×'),
              slider('Forma', () => params.intimateForm, (v) => set({ intimateForm: v }), 0, 1, 0.01),
              color('Tinte de piel', 'intimateTint', false),
              el('label', { className: 'acc' }, pubicHairBox, 'Vello púbico'),
              slider('Densidad del vello', () => params.pubicHairAmount, (v) => set({ pubicHairAmount: v }), 0, 1, 0.01, (v) => String(Math.round(v * 100)) + '%'),
              slider('Largo del vello', () => params.pubicHairLength, (v) => set({ pubicHairLength: v }), 0.35, 1.5, 0.01, (v) => String(v.toFixed(2)) + '×'),
              color('Color del vello', 'pubicHairColor', false),
              el('div', { className: 'hint', textContent: 'Malla generada dentro del proyecto, sin descargar modelos adicionales. Para verla: prenda inferior en None y Underwear desactivado.' }),
            ),
          section('Accessories', true, accessoriesPanel(), earringPanel()),"""
          main = once(main, "  section('Accessories', true, accessoriesPanel(), earringPanel()),", panel, "anatomy controls section")
          write("src/app/main.ts", main)
          print("Only the procedural anatomy mesh and its controls were added.")
          PY

      - name: Install existing dependencies, build and test
        run: |
          cd "$RUNNER_TEMP/ara"
          # Reuse the already-published catalog, body/target packs, proxies and textures.
          # Only the engine source changes; no MakeHuman/asset-pack re-download is needed.
          mkdir -p "$RUNNER_TEMP/ara/public/assets"
          cp -a "$GITHUB_WORKSPACE/avatar-lab/assets/." "$RUNNER_TEMP/ara/public/assets/"
          find "$RUNNER_TEMP/ara/public/assets" -maxdepth 1 -type f -name '*.js' -delete
          find "$RUNNER_TEMP/ara/public/assets" -maxdepth 1 -type f -name '*.css' -delete
          find "$RUNNER_TEMP/ara/public/assets" -maxdepth 1 -type f -name '*.map' -delete
          npm install --no-audit --no-fund
          BASE_PATH=/Feliz-cumplea-os-/avatar-lab/ npm run build
          test -s dist/app/index.html
          test -d dist/assets

      - name: Publish the original design under /avatar-lab
        run: |
          rm -rf avatar-lab
          mkdir -p avatar-lab
          cp "$RUNNER_TEMP/ara/dist/app/index.html" avatar-lab/index.html
          cp -a "$RUNNER_TEMP/ara/dist/assets" avatar-lab/assets
          for f in favicon.ico favicon.svg apple-touch-icon.png icon-192.png icon-512.png site.webmanifest; do
            if [ -f "$RUNNER_TEMP/ara/dist/$f" ]; then cp "$RUNNER_TEMP/ara/dist/$f" "avatar-lab/$f"; fi
          done
          printf '%s\n' 'Original Avatar Lab + procedural anatomy mesh' > avatar-lab/BUILD_INFO.txt

      - name: Commit generated site files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add avatar-lab/
          if git diff --cached --quiet; then
            echo "No generated site changes."
          else
            git commit -m "Restore original Avatar Lab and add procedural anatomy mesh"
            git push
          fi
