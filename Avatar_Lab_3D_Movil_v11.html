<div id="app">
 <header>

 </header>
 <section id="stage">
  <canvas id="view" aria-label="Modelo humano 3D; girá con un dedo"></canvas>
  <div id="hud"><div class="hudCard"><strong class="hudTitle" id="displayName">El Viajero</strong><span class="hudSub" id="desc">Humano · 25 años · masculino</span><span class="hudBadge" id="bodyTag">Complexión normal</span></div><div class="hudCard right"><strong class="hudTitle">VISTA 3D</strong><span class="hudSub" id="heightTag">1,72 m</span><span class="hudBadge">ARRASTRÁ PARA GIRAR</span></div></div>
  <div id="hint">Deslizá un dedo sobre el modelo para girarlo · Pellizcá para acercar</div>
  <div id="modelError" role="status"></div>
  <div id="toast" role="status"></div>

  if(!o.isMesh||!o.geometry?.attributes?.position)return;

  geo.computeBoundingBox();
  // A material array can include brows on a much larger face/body mesh. Do not
  // deform that entire mesh; a material-only match must have brow-sized bounds.

   browBaseData.set(o,{positions:attr.array.slice(),center:[(bb.min.x+bb.max.x)/2,(bb.min.y+bb.max.y)/2,(bb.min.z+bb.max.z)/2],height:bb.max.y-bb.min.y,scale:o.scale.clone(),position:o.position.clone(),rotation:o.rotation.clone()});

  for(let i=0;i<arr.length;i+=3){
   const dx=arr[i]-base.center[0],dy=arr[i+1]-base.center[1];
   const side=Math.abs(base.center[0])>.002?Math.sign(base.center[0]):Math.sign(dx);

 if(sclera.length&&iris.length){
  for(const {o,label} of eyeObjects){
   o.visible=true;o.frustumCulled=false;
   for(const m of [].concat(o.material||[])){
    if(!m)continue;m.visible=true;
    if(/eye|eyes|sclera|eyeball/.test((o.name+' '+m.name).toLowerCase())&&!/iris|cornea|pupil/.test((o.name+' '+m.name).toLowerCase())){
     m.opacity=1;m.transparent=false;m.color?.set('#eee8de');m.roughness=Math.max(.18,Math.min(.32,m.roughness??.25));
    }
    if(/iris/i.test(m.name)&&m.color)m.color.set(state.eyeColor);
    m.needsUpdate=true;
   }
  }
  return;
 }
 // Hide only small, eye-like meshes in the face area; never hide the body mesh.
 for(const {o} of eyeObjects)o.visible=false;
 const T=engine.THREE, head=headBone;
 const parent=head||root;
 const eyeRoot=new T.Group();eyeRoot.name='AvatarLab_EyeFallback';
 if(head){head.add(eyeRoot);eyeRoot.position.set(0,0,0);}
 else {root.add(eyeRoot);eyeRoot.position.set(0,1.57,.08);}
 const makeMat=(color,roughness=.35,metalness=0)=>new T.MeshStandardMaterial({color,roughness,metalness});
 const whiteMat=makeMat('#eee8de',.24), rimMat=makeMat('#34251c',.55), pupilMat=makeMat('#101013',.18);
 const glossMat=new T.MeshBasicMaterial({color:'#ffffff'});
 const ballGeo=new T.SphereGeometry(1,32,24);
 for(const side of [-1,1]){
  const group=new T.Group();group.name=side<0?'EyeFallback_L':'EyeFallback_R';eyeRoot.add(group);
  const sclera=new T.Mesh(ballGeo,whiteMat);sclera.name='FallbackSclera';sclera.scale.set(.024,.019,.015);sclera.castShadow=false;group.add(sclera);
  const irisRim=new T.Mesh(new T.SphereGeometry(1,24,18),rimMat);irisRim.scale.set(.0104,.0104,.0028);irisRim.position.set(0,0,.0135);irisRim.castShadow=false;group.add(irisRim);
  const iris=new T.Mesh(new T.SphereGeometry(1,32,24),makeMat(state.eyeColor,.32));iris.scale.set(.0088,.0088,.0032);iris.position.set(0,0,.0147);iris.castShadow=false;group.add(iris);
  // Iris fibres live in eye-group space (not iris-scaled space) so they remain visible on close-ups.
  const fiberMat=new T.LineBasicMaterial({color:new T.Color(state.eyeColor).lerp(new T.Color('#d5b17a'),.32)});
  const fiberGeo=new T.BufferGeometry(),fiberPos=[];
  for(let i=0;i<24;i++){const a=i/24*Math.PI*2,r1=.0042,r2=.0071;fiberPos.push(Math.cos(a)*r1,Math.sin(a)*r1,.0175,Math.cos(a)*r2,Math.sin(a)*r2,.0175)}
  fiberGeo.setAttribute('position',new T.Float32BufferAttribute(fiberPos,3));
  const fibers=new T.LineSegments(fiberGeo,fiberMat);fibers.name='FallbackIrisFibres';group.add(fibers);
  const pupil=new T.Mesh(new T.SphereGeometry(1,24,18),pupilMat);pupil.scale.set(.0041,.005,.0016);pupil.position.set(0,0,.0173);pupil.castShadow=false;group.add(pupil);
  const glint=new T.Mesh(new T.SphereGeometry(1,12,10),glossMat);glint.scale.set(.0021,.0021,.001);glint.position.set(-.0027,.003,.019);glint.castShadow=false;group.add(glint);
  const lid=new T.Mesh(new T.SphereGeometry(1,24,16),makeMat(state.skin,.76));lid.scale.set(.023,.004,.003);lid.position.set(0,.016,.004);lid.castShadow=false;group.add(lid);
  fallbackEyes.push({side,group,sclera,iris,irisRim,pupil,glint,lid,fiberMat});
 }
 eyeRoot.userData.fallback=true;
 updateFallbackEyeAppearance();
}
function updateFallbackEyeAppearance(weights=null){
 if(!fallbackEyes.length||!engine?.THREE)return;
 const T=engine.THREE, color=new T.Color(state.eyeColor), skin=new T.Color(state.skin);
 const w=weights||{};
 for(const e of fallbackEyes){
  const spacing=.034*(1+Math.max(-.75,Math.min(.75,state.eyeSpacing))*.23);
  const ageEye=1+Math.max(0,(18-state.age)/8)*.09-Math.max(0,(state.age-48)/12)*.025;
  const size=(1+Math.max(-.8,Math.min(.8,state.eyeSize))*.18)*ageEye;
  e.group.position.set(e.side*spacing,.054+state.forehead*.003,.063);
  e.sclera.scale.set(.024*size,.019*size,.015*size);
  e.iris.material.color.copy(color);e.irisRim.material.color.copy(color).multiplyScalar(.57);
  e.fiberMat.color.copy(color).lerp(new T.Color('#dfc18c'),.28);
  e.lid.material.color.copy(skin);
  const x=((w.look_left||0)-(w.look_right||0))*.0048;
  const y=((w.look_up||0)-(w.look_down||0))*.0038;
  e.iris.position.set(x,y,.0147);e.irisRim.position.set(x,y,.0135);
  e.pupil.position.set(x,y,.0173);e.glint.position.set(x-.0027,y+.003,.019);
  const blink=Math.max(w.blink_left||0,w.blink_right||0);
  e.lid.scale.set(.023,.004+blink*.014,.003);e.lid.position.set(0,.016-blink*.012,.0048);
  e.lid.visible=blink>.12;
 }
}

function setupMaterials(root){root.traverse(o=>{if(!o.isMesh)return;o.castShadow=true;o.receiveShadow=true;for(const m of [].concat(o.material||[])){if(!m)continue;const role=engine.materialRole(m.name);if(role==='hair'||role==='brows'||role==='lashes'){m.alphaToCoverage=true;m.transparent=false;m.depthWrite=true;m.side=engine.THREE.DoubleSide;if(role!=='hair')o.castShadow=false}if(m.name==='Cornea'){m.envMapIntensity=.7;o.castShadow=false;o.receiveShadow=false;o.renderOrder=2}if(m.name==='Eye'||m.name==='Iris')o.castShadow=false;m.needsUpdate=true}})}
async function setHair(id){
 if(!ready||!hairCatalog)return;currentHair=id||null;
 for(const [k,ms]of hairCache)for(const m of ms)m.visible=k===currentHair;
 if(!currentHair){state.hair='none';applyModel();return}
 if(!hairCache.has(currentHair)){
  const style=hairCatalog.styles.find(s=>s.id===currentHair);if(!style)throw new Error('Peinado no encontrado: '+currentHair);
  status('CARGANDO CABELLO…');const g=await loader.loadAsync(ASSETS+style.file);const ms=engine.characterMeshes(g.scene);if(!ms.length)throw new Error('El peinado no contiene malla con esqueleto');
  const holder=body.parent;for(const m of ms){m.removeFromParent();m.position.copy(body.position);m.quaternion.copy(body.quaternion);m.scale.copy(body.scale);holder.add(m);const res=engine.bindToSkeleton(m,body.skeleton,body.bindMatrix);if(res.missing.length)throw new Error('El peinado no coincide con el esqueleto del cuerpo');m.frustumCulled=false;parts.push(m)}
  await upgradeMaterials({traverse:fn=>ms.forEach(m=>m.traverse(fn))},g.parser);setupMaterials({traverse:fn=>ms.forEach(m=>m.traverse(fn))});hairCache.set(currentHair,ms)
 }
 for(const [k,ms]of hairCache)for(const m of ms)m.visible=k===currentHair;state.hair=currentHair;applyModel();status('MODELO 3D · LISTO');
}
function resize(){if(!renderer||!camera)return;const stage=$('#stage');const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
window.addEventListener('resize',resize);if(window.visualViewport)window.visualViewport.addEventListener('resize',resize);
init3D();
</script>
